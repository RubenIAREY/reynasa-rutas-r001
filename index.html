<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Reynasa · Rutas R001</title>
<style>:root{color-scheme:dark}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#061E3C;color:#EEF3F9;font:16px/1.45 "Segoe UI",Arial,sans-serif;padding:16px;box-sizing:border-box}
form{width:min(420px,100%);background:#0C2C54;border-radius:10px;padding:28px 28px 24px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
h1{margin:0 0 6px;font-size:24px}p{margin:0 0 18px;color:#A8B9CF;font-size:15px}.ban{height:6px;border-radius:3px;margin-bottom:18px;background:linear-gradient(90deg,#004A98 0 72%,#CE0E2D 72% 86%,#FFA400 86%)}
label{display:block;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#FFA400;margin-bottom:6px}
input{width:100%;box-sizing:border-box;padding:12px 14px;border-radius:8px;border:1px solid #23446E;background:#061E3C;color:#fff;font-size:17px}
button{margin-top:14px;width:100%;padding:12px;border:0;border-radius:8px;background:#FFA400;color:#0B0E13;font-weight:700;font-size:16px;cursor:pointer}
#msg{min-height:22px;margin-top:10px;font-size:14px;color:#FFB4B4}</style></head><body>
<form id="f"><div class="ban"></div><h1>Rutas de reparto R001</h1><p>Página privada de Reynasa. Escribe la contraseña que te ha dado Rubén.</p>
<label for="pw">Contraseña</label><input id="pw" type="password" autocomplete="current-password" autofocus required>
<button type="submit">Ver las rutas</button><div id="msg" role="status"></div></form>
<script>
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
document.getElementById('f').addEventListener('submit',async ev=>{
  ev.preventDefault();const msg=document.getElementById('msg');msg.textContent='Abriendo…';
  try{
    const man=await (await fetch('manifiesto.json',{cache:'no-store'})).json();
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('pw').value),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(man.sal),iterations:man.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    const b=new Uint8Array(await (await fetch(man.doc,{cache:'no-store'})).arrayBuffer());
    const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},key,b.slice(12)));
    document.open();document.write(html);document.close();
  }catch(err){msg.textContent='Contraseña incorrecta. Vuelve a probar.'}
});
</script></body></html>
